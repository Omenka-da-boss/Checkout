<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First E-commerce</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>
                LIST OF PRODUCT
            </h1>
            <div class="iconcart">
                <img class="myImg" src="icon.png" alt="">
                <div class="totalQuantity">
                    0
                </div>
            </div>
        </header>
        <div class="listProduct">
            <div class="items">
                <img src="./images/1.webp" alt="">
                <div class="conten">
                    <h2>Product Name</h2>
                <div class="price">$100</div>
                <button class="btn">Add to Cart</button>
                </div>
            </div>
            <div class="items">
                <img src="./images/2.webp" alt="">
               <div class="conten">
                <h2>Product Name</h2>
                <div class="price">$100</div>
                <button>Add to Cart</button>
               </div>
            </div>
            <div class="items">
                <img src="./images/3.webp" alt="">
                <div class="conten">
                    <h2>Product Name</h2>
                    <div class="price">$100</div>
                    <button>Add to Cart</button>
                </div>
            </div>
        </div>
       <div class="cart">
        <div class="h2">
            <h2>
                CART
            </h2>
        </div>
        <div class="listCart">
            <div class="item">
                <img src="./images/1.webp" alt="">
                <div class="content">
                    <div class="name">
                        Product Name
                    </div>
                    <div class="prices">
                        $50/ 1 Product
                    </div>
                    <div class="quantity">
                        <button>-</button>
                        <span class="value">3</span>
                        <button>+</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="button">
            <div class="close">
                CLOSE
            </div>
            <div class="checkout">
                <a href="check.html">CHECKOUT</a>
            </div>
        </div>
       </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
